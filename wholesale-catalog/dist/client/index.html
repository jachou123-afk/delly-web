<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#112340">
  <meta name="description" content="查詢正版帶雷標商品、玩具與生活用品的批發單價、箱入數及整箱估算。">
  <meta name="robots" content="noindex, nofollow">
  <title>大陸工廠直發｜新品批發目錄</title>
  <link rel="stylesheet" href="./styles.css?v=22">
  <script defer src="./catalog-data.js?v=37"></script>
  <script defer src="./owner-quote-tools.js?v=2"></script>
  <script defer src="./ad-selections.js?v=2"></script>
  <script defer src="./catalog.js?v=19"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner shell">
      <a id="home-link" class="brand" href="./index.html" aria-label="大陸工廠直發新品批發目錄首頁">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span>大陸工廠直發</span>
      </a>
      <span class="header-currency">新台幣計價</span>
    </div>
  </header>
  <main id="app">
    <noscript><p class="shell">請開啟 JavaScript 以查看商品目錄。</p></noscript>
  </main>
  <div id="notice" class="notice" role="status" hidden></div>
  <dialog id="inquiry" class="inquiry" aria-labelledby="inquiry-title">
    <form method="dialog" class="dialog-top">
      <h2 id="inquiry-title">LINE 詢價</h2>
      <button type="submit" class="close-button" aria-label="關閉詢價視窗">×</button>
    </form>
    <p>複製下方的詢價內容，貼到你和店家的 LINE 對話。</p>
    <label for="inquiry-cartons">預計採購箱數（選填）</label>
    <input id="inquiry-cartons" class="inquiry-cartons" type="text" inputmode="numeric" pattern="[1-9][0-9]*" maxlength="9">
    <label for="inquiry-message">詢價內容</label>
    <textarea id="inquiry-message" rows="5" readonly></textarea>
    <button id="copy-inquiry" class="button primary" type="button">複製詢價內容</button>
    <p class="dialog-status" id="inquiry-status" role="status" hidden></p>
  </dialog>
  <dialog id="quote-draft" class="inquiry" aria-labelledby="quote-draft-title">
    <form method="dialog" class="dialog-top">
      <h2 id="quote-draft-title">LINE 廣告文案</h2>
      <button type="submit" class="close-button" aria-label="關閉廣告文案">×</button>
    </form>
    <p id="quote-draft-product" class="quote-draft-product"></p>
    <label for="quote-draft-message">文案可直接修改</label>
    <textarea id="quote-draft-message" rows="9"></textarea>
    <button id="copy-quote-draft" class="button primary" type="button">複製文案</button>
    <p id="quote-draft-status" class="dialog-status" role="status" hidden></p>
  </dialog>
  <dialog id="ad-selection-queue" class="inquiry" aria-labelledby="ad-selection-queue-title">
    <form method="dialog" class="dialog-top">
      <h2 id="ad-selection-queue-title">待審批次</h2>
      <button type="submit" class="close-button" aria-label="關閉待審批次">×</button>
    </form>
    <div id="ad-selection-queue-items" class="ad-selection-queue-items" aria-live="polite"></div>
  </dialog>
</body>
</html>
