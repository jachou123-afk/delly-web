<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#112340">
  <meta name="description" content="查看玩具批發新品、台幣售價與箱入數。">
  <meta name="robots" content="noindex, nofollow">
  <title>玩具批發｜新品目錄</title>
  <link rel="stylesheet" href="./styles.css?v=8">
  <script defer src="./catalog-data.js?v=9"></script>
  <script defer src="./catalog.js?v=8"></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner shell">
      <a id="home-link" class="brand" href="./index.html" aria-label="玩具批發目錄首頁">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span>玩具批發<small>新品目錄</small></span>
      </a>
      <span class="preview-tag">店主試看</span>
    </div>
  </header>
  <main id="app">
    <noscript><p class="shell">請開啟 JavaScript 以查看商品目錄。</p></noscript>
  </main>
  <footer class="site-footer shell">
    <span>玩具批發目錄</span>
    <span>價格以新台幣計</span>
  </footer>
  <div id="notice" class="notice" role="status" hidden></div>
  <dialog id="inquiry" class="inquiry" aria-labelledby="inquiry-title">
    <form method="dialog" class="dialog-top">
      <h2 id="inquiry-title">LINE 詢價</h2>
      <button type="submit" class="close-button" aria-label="關閉詢價視窗">×</button>
    </form>
    <p>正式 LINE 入口待確認。可先複製以下內容，貼到 LINE 對話。</p>
    <label for="inquiry-message">詢價內容</label>
    <textarea id="inquiry-message" rows="5" readonly></textarea>
    <button id="copy-inquiry" class="button primary" type="button">複製詢價內容</button>
    <p class="dialog-status" id="inquiry-status" role="status" hidden></p>
  </dialog>
</body>
</html>
